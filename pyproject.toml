# Outillage de développement uniquement : HACS n'installe que custom_components/pool_technologie.

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components/pool_technologie"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.format]
# Gardé dans le style du dépôt (schémas « vol.Schema({ »), pour ne pas
# reformater le flux d'options, inchangé.
exclude = ["custom_components/pool_technologie/config_flow.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B"]

[tool.mypy]
python_version = "3.14"
packages = ["custom_components.pool_technologie"]
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true

# La bibliothèque vendorisée est entièrement typée : options de --strict.
[[tool.mypy.overrides]]
module = "custom_components.pool_technologie.pool_technologie_modbus.*"
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
extra_checks = true
