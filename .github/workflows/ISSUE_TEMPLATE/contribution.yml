name: "Découverte / confirmation Modbus"
description: "Signaler un nouveau registre découvert, ou confirmer qu'une entité fonctionne (ou pas) sur votre modèle d'électrolyseur"
title: "[Découverte] "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de contribuer ! Ces informations aident à rendre l'intégration compatible avec le plus de modèles possible.
        Vous pouvez remplir uniquement les champs pertinents pour votre cas (nouveau registre OU confirmation d'une entité existante).

  - type: dropdown
    id: modele
    attributes:
      label: Modèle d'électrolyseur
      options:
        - Ibiza iBasel Duo
        - WaterAir Salt Gold Duo
        - Poolsquad UV
        - Just Salt Pro
        - Autre modèle Pool Technologie (précisez dans les détails)
    validations:
      required: true

  - type: dropdown
    id: type_contribution
    attributes:
      label: Type de contribution
      options:
        - Confirmation qu'une entité existante fonctionne sur mon modèle
        - Confirmation qu'une entité existante NE fonctionne PAS sur mon modèle
        - Nouveau registre Modbus découvert (non encore intégré)
    validations:
      required: true

  - type: input
    id: entite_registre
    attributes:
      label: Entité concernée ou adresse de registre
      description: "Nom de l'entité existante (ex. Consigne électrolyse) OU adresse du nouveau registre (ex. 4168)"
      placeholder: "Consigne électrolyse (registre 4168)"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: "Que fait ce registre / cette entité ? Unité, échelle, plage de valeurs si connue."
    validations:
      required: true

  - type: textarea
    id: methode
    attributes:
      label: Comment avez-vous vérifié ?
      description: "Ex. comparaison avec l'affichage de l'application Pool Technologie, test en changeant la valeur et en observant l'effet, scan modpoll avant/après, etc."
    validations:
      required: true

  - type: textarea
    id: contexte
    attributes:
      label: Contexte matériel (optionnel)
      description: "Sonde ORP installée ou non, topologie de votre installation (ex. iBaRegul Duo + iBaSel séparés), version de l'intégration, etc."
